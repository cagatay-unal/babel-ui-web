name: Babel UI Web CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check environment
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Move GitHub Project task to Done
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: cagatay-unal
          PROJECT_NUMBER: "13"
        run: |
          set -x

          TASK_ID=$(git log -1 --pretty=%B | grep -oE 'TASK-[0-9]+' | head -n 1)

          if [ -z "$TASK_ID" ]; then
            echo "No TASK ID found. Skipping."
            exit 0
          fi

          echo "Found task: $TASK_ID"

          echo "Checking GitHub CLI..."
          gh --version

          echo "Searching issue..."

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --search "$TASK_ID in:title" \
            --limit 100 \
            --json title,url

          echo "Issue search completed."
